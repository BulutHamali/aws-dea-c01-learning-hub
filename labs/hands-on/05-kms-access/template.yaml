AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DEA-C01 hands-on lab 5. A customer managed KMS key, a bucket encrypted with it,
  and a reader role whose KMS permission can be switched on and off.

Parameters:
  Prefix:
    Type: String
    Default: dea-lab5
    AllowedPattern: "[a-z0-9-]{3,20}"
  GrantDecrypt:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Conditions:
  WithDecrypt: !Equals [!Ref GrantDecrypt, "true"]

Resources:
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: DEA-C01 lab 5 data key
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIamPoliciesInThisAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-data-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-reader"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-objects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/*"
        - !If
          - WithDecrypt
          - PolicyName: decrypt-data-key
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !GetAtt DataKey.Arn
          - !Ref AWS::NoValue

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  ReaderRoleArn:
    Value: !GetAtt ReaderRole.Arn
  KeyArn:
    Value: !GetAtt DataKey.Arn
